name: Publish packages

# Pushes Fuaran.Facts to nuget.org. Triggered by a tag push matching `v*` (the "ship this release"
# gesture) or by workflow_dispatch (the rerun-against-an-existing-tag escape hatch). The version
# baked into the pack is the <Version> in Directory.Build.props at the tagged commit; every package
# this repository packs ships at that one version.
#
# A push to a branch reaches nothing here. Publication is a deliberate act — the tag — and never a
# side effect of landing work.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # `id-token: write` lets the job request the GitHub OIDC token that nuget.org's Trusted
  # Publishing exchange turns into a short-lived API key.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The conformance corpus is a build input of the tests, not of the package: the pack below
      # needs nothing but nuget.org, which is also the honest test that the package does.
      - name: Pack
        run: >
          dotnet pack src/Fuaran.Facts/Fuaran.Facts.fsproj
          -c Release -o "${{ github.workspace }}/artifacts" --nologo

      # Trusted Publishing (OIDC): a policy on nuget.org (repository owner / repository / this
      # workflow's file name) exchanges the job's OIDC token for a one-hour API key, so there is no
      # long-lived secret. `user` is the nuget.org profile the policy belongs to. The policy must
      # be registered before the first tag, or this step fails.
      - name: NuGet login (OIDC to a temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ajwillshire # the policy owner (a nuget.org profile name is public, not a secret)

      - name: Push to nuget.org
        run: |
          shopt -s nullglob
          pkgs=("$GITHUB_WORKSPACE"/artifacts/*.nupkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No .nupkg files found in artifacts/: Pack produced nothing." >&2
            exit 1
          fi
          # This repository packs the Fuaran.Facts ids and nothing else. Anything else reaching this
          # loop is refused rather than published: --skip-duplicate would not save us, because an
          # unexpected id does not exist on nuget.org and would be CREATED.
          for pkg in "${pkgs[@]}"; do
            case "$(basename "$pkg")" in
              Fuaran.Facts.*) ;;
              *)
                echo "refusing to push unexpected package id: $(basename "$pkg")" >&2
                exit 1
                ;;
            esac
          done
          for pkg in "${pkgs[@]}"; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
              --skip-duplicate
          done
